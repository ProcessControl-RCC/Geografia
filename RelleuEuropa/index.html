<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-screen app — atlas map fills the stage, a study panel docks right (stacks below on phones). */
:root{
  --bg:#e8eeed; --panel:#fbfcfa; --ink:#1b2a2e; --muted:#5a6a6e; --line:#d0dad9;
  --sea:#bcd8e2; --grat:#a7c9d6; --land:#e4e2c6; --coast:#8f9c79; --border:#bdb596; --halo:#f8f9f3;
  --accent:#0c6a88; --accent-ink:#ffffff; --ok:#2c8a4b; --bad:#c23e2b;
  --c-plana:#9d6417; --c-nord:#6c4a99; --c-sud:#b0432a; --c-mars:#1f69a0;
  --c-pen:#5a7a18; --c-illes:#17836a; --c-caps:#bf1d5c; --c-golfs:#4656b0;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-sea:"Spectral",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171a; --panel:#152024; --ink:#e4eded; --muted:#9bb0b3; --line:#29393e;
  --sea:#14313d; --grat:#1c4150; --land:#2b3326; --coast:#5f6f52; --border:#4b4f3d; --halo:#0e1619;
  --accent:#5fc3e3; --accent-ink:#06222c; --ok:#5ccf85; --bad:#ff7d68;
  --c-plana:#e2a64c; --c-nord:#b9a0e6; --c-sud:#f28d6c; --c-mars:#6fb9ef;
  --c-pen:#abc95c; --c-illes:#5fd3ae; --c-caps:#f472a4; --c-golfs:#9ca8f6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171a; --panel:#152024; --ink:#e4eded; --muted:#9bb0b3; --line:#29393e;
  --sea:#14313d; --grat:#1c4150; --land:#2b3326; --coast:#5f6f52; --border:#4b4f3d; --halo:#0e1619;
  --accent:#5fc3e3; --accent-ink:#06222c; --ok:#5ccf85; --bad:#ff7d68;
  --c-plana:#e2a64c; --c-nord:#b9a0e6; --c-sud:#f28d6c; --c-mars:#6fb9ef;
  --c-pen:#abc95c; --c-illes:#5fd3ae; --c-caps:#f472a4; --c-golfs:#9ca8f6; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:12px;padding:12px 16px 16px}
.top{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3vw,30px);line-height:1;letter-spacing:-.01em}
h1 small{font-weight:600;font-size:.5em;color:var(--muted);letter-spacing:0;margin-left:6px}
.modes{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.modes button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:700;color:var(--muted)}
.modes button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.modes button:hover:not([aria-selected="true"]){color:var(--ink);background:var(--bg)}
.score{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;display:flex;gap:14px}
.score .ok{color:var(--ok)} .score .bad{color:var(--bad)}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;min-height:0}
.mapwrap{position:relative;min-height:0;border-radius:14px;overflow:hidden;background:var(--sea);border:1px solid var(--line)}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map:active{cursor:grabbing}
.zoomctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoomctl button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:18px;font-weight:700;line-height:1}
.maphint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:3px 8px;border-radius:6px}
.toast{position:absolute;left:50%;top:12px;transform:translate(-50%,-6px);opacity:0;transition:opacity .2s,transform .2s;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700;pointer-events:none;white-space:nowrap;max-width:80%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{color:var(--ok);border-color:var(--ok)} .toast.bad{color:var(--bad);border-color:var(--bad)}

/* map layers */
.land{fill:var(--land);stroke:var(--coast);stroke-width:.7}
.borders{fill:none;stroke:var(--border);stroke-width:.6}
.grat{fill:none;stroke:var(--grat);stroke-width:.5}
.land,.borders,.grat,.range path,.isle{vector-effect:non-scaling-stroke}
.range .under{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.28}
.range .top{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:7 4}
.range.off{opacity:.15}
.isle{fill-opacity:.55;stroke-width:1.2;opacity:0;transition:opacity .25s}
.study .isle:not(.off),.isle.show{opacity:1}

.mk{cursor:pointer}
.mk.off{display:none}
.mk .hit{fill:transparent}
.mk .dot{stroke:var(--halo);stroke-width:2}
.mk .ring{fill:none;stroke:var(--accent);stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}
.mk .lab{font-size:12.5px;font-weight:700;paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;stroke-linejoin:round;opacity:0;pointer-events:none}
.mk.peak .dot{display:none}
.mk .tri{stroke:var(--halo);stroke-width:1.5;display:none}
.mk.peak .tri{display:inline}
.study.labels .mk .lab,.mk.done .lab,.mk.reveal .lab{opacity:1}
.study .mk.area .dot{opacity:0}
.study .mk.area .lab{font-weight:500}
.mk.s-mars .lab,.mk.s-golfs .lab{font-family:var(--f-sea);font-style:italic;font-size:14px;letter-spacing:.02em}
.mk.big .lab{font-size:17px;letter-spacing:.06em}
.mk.s-pen .lab{text-transform:uppercase;letter-spacing:.16em;font-size:10.5px}
.mk.done .dot{stroke:var(--ok);stroke-width:3}
.mk.hot .dot,.mk.sel .dot{stroke:var(--ink);stroke-width:3}
.mk.hot .ring{opacity:1;stroke:var(--ink)}
.mk.target .ring{opacity:1;animation:pulse 1.1s ease-out infinite}
.mk.flash-ok .ring{opacity:1;stroke:var(--ok)}
.mk.flash-bad .ring{opacity:1;stroke:var(--bad)}
.mk.flash-bad .dot{fill:var(--bad)}
.mk:hover .dot{stroke:var(--ink)}
.study.hidden-labels .mk:hover .lab{opacity:1}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.7);opacity:0}}

/* panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.ph{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ph h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.15;text-wrap:balance}
.ph p{margin:0;color:var(--muted);font-size:13.5px}
.pb{padding:12px 16px 16px;overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px}
.field label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
select{font:inherit;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.btn{border:1px solid var(--line);background:var(--bg);padding:8px 14px;border-radius:9px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{border-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

.sec h3{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sec h3 .n{color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none}
.sw{width:10px;height:10px;border-radius:50%;flex:none;background:currentColor}
.items{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:8px}
.item:hover,.item.active{background:var(--bg)}
.item .nm{flex:1;min-width:0}
.item .note{display:block;font-size:12px;color:var(--muted)}
.pips{display:flex;gap:3px}
.pips i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--ok)}

.progress{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.progress span{display:block;height:100%;background:var(--ok);transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--panel);font-weight:700;font-size:14px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.chip.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.chip.shake{animation:shake .35s}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;box-shadow:0 8px 20px rgb(0 0 0 / .25);cursor:grabbing}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

.ask{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.ask .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ask .q{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1;text-wrap:balance}
.ask .cat{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.fb{font-weight:700;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 10px;font-weight:700;text-align:left;display:flex;gap:8px;align-items:baseline}
.opt kbd{font-family:var(--f-body);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
.opt:disabled{cursor:default}
.summary{display:flex;flex-direction:column;gap:10px}
.big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.missed{display:flex;flex-wrap:wrap;gap:6px}
.missed span{font-size:13px;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--bad) 12%,var(--bg));color:var(--bad);font-weight:700}
.muted{color:var(--muted);font-size:13px}

@media (max-width:820px){
  html,body{height:auto}
  .app{height:auto}
  .stage{grid-template-columns:1fr}
  .mapwrap{height:62svh;min-height:340px}
  .pb{overflow:visible}
  .score{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const ITEMS=[

const col=k=>`var(--c-${k})`;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- progrés guardat en aquest navegador ---------- */
const KEY='relleu-europa-v1';
let stats={};
try{stats=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){stats={}}
function record(id,ok){
  const s=stats[id]||(stats[id]={ok:0,ko:0});
  ok?s.ok++:s.ko++;
  try{localStorage.setItem(KEY,JSON.stringify(stats))}catch(e){}
}
const level=id=>{const s=stats[id];return s?Math.max(0,Math.min(3,s.ok-s.ko)):0};

/* ---------- mapa ---------- */
const W=1000,H=800;
const svg=d3.select('#map').attr('viewBox',`0 0 ${W} ${H}`).attr('preserveAspectRatio','xMidYMid meet');
const proj=d3.geoConicConformal().parallels([40,68]).rotate([-18,0])
  .fitExtent([[0,0],[W,H]],{type:'MultiPoint',coordinates:[[-24,34],[-26,66],[64,40],[62,70],[18,32.5],[18,76.5]]});
proj.clipExtent([[-W,-H],[2*W,2*H]]);
const path=d3.geoPath(proj);
const world=window.WORLD;
const land=topojson.feature(world,world.objects.land);
const gZ=svg.append('g');
gZ.append('path').attr('class','grat').attr('d',path(d3.geoGraticule().step([10,10])()));
gZ.append('path').attr('class','land').attr('d',path(land));
gZ.append('path').attr('class','borders').attr('d',path(topojson.mesh(world,world.objects.countries,(a,b)=>a!==b)));

ITEMS.forEach(d=>d.xy=proj(d.at));

// illes: busca el polígon de terra que conté cada punt
const polys=[];land.features.forEach(f=>{const g=f.geometry;(g.type==='Polygon'?[g.coordinates]:g.coordinates).forEach(c=>polys.push({type:'Polygon',coordinates:c}))});
const gIsle=gZ.append('g');
ITEMS.filter(d=>d.s==='illes').forEach(d=>{
  const found=[d.at,...(d.pts||[])].map(p=>polys.find(pg=>d3.geoContains(pg,p))).filter(Boolean);
  if(found.length) d.isle=gIsle.append('path').attr('class','isle').attr('d',path({type:'GeometryCollection',geometries:found}))
    .style('fill',col(d.s)).style('stroke',col(d.s));
});

// serralades
const lineGen=d3.line().curve(d3.curveCatmullRom.alpha(.5));
const gRange=gZ.append('g');
ITEMS.filter(d=>d.line).forEach(d=>{
  const g=gRange.append('g').attr('class','range').style('stroke',col(d.s));
  const dd=lineGen(d.line.map(p=>proj(p)));
  g.append('path').attr('class','under').attr('d',dd);
  g.append('path').attr('class','top').attr('d',dd);
  d.range=g;
});

// marcadors
const gMk=gZ.append('g');
const mk=gMk.selectAll('g.mk').data(ITEMS).join('g')
  .attr('class',d=>`mk s-${d.s}${AREA.has(d.s)?' area':''}${d.peak?' peak':''}${d.big?' big':''}`)
  .attr('data-id',d=>d.id);
mk.append('circle').attr('class','hit').attr('r',15);
mk.append('circle').attr('class','ring').attr('r',14);
mk.append('circle').attr('class','dot').attr('r',6).style('fill',d=>col(d.s));
mk.append('path').attr('class','tri').attr('d','M0,-9 L8,5 L-8,5 Z').style('fill',d=>col(d.s));
mk.append('text').attr('class','lab').attr('x',d=>d.lab[0]).attr('y',d=>d.lab[1]).attr('text-anchor',d=>d.lab[2])
  .style('fill',d=>col(d.s)).text(d=>d.n);
ITEMS.forEach(d=>d.el=gMk.select(`[data-id="${d.id}"]`));

let K=1;
const place=()=>mk.attr('transform',d=>`translate(${d.xy[0]},${d.xy[1]}) scale(${1/K})`);
const zoom=d3.zoom().scaleExtent([1,10]).translateExtent([[-W*.3,-H*.3],[W*1.3,H*1.3]])
  .on('zoom',e=>{gZ.attr('transform',e.transform);K=e.transform.k;place()});
svg.call(zoom).on('dblclick.zoom',null);
place();
const T=()=>reduce?svg:svg.transition().duration(650);
document.getElementById('zin').onclick=()=>T().call(zoom.scaleBy,1.6);
document.getElementById('zout').onclick=()=>T().call(zoom.scaleBy,1/1.6);
document.getElementById('zreset').onclick=()=>T().call(zoom.transform,d3.zoomIdentity);
function flyTo(d){
  let pts=d.line?d.line.map(p=>proj(p)):[d.xy];
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const bw=Math.max(...xs)-Math.min(...xs)+60,bh=Math.max(...ys)-Math.min(...ys)+60;
  const s=Math.min(4,Math.max(1.6,Math.min(W/bw,H/bh)*.6));
  const cx=(Math.max(...xs)+Math.min(...xs))/2,cy=(Math.max(...ys)+Math.min(...ys))/2;
  T().call(zoom.transform,d3.zoomIdentity.translate(W/2,H/2).scale(s).translate(-cx,-cy));
}

/* ---------- utilitats d'interfície ---------- */
const $=s=>document.querySelector(s);
const panel=$('#panel'),scoreEl=$('#score'),toastEl=$('#toast');
let toastT;
function toast(msg,kind){toastEl.textContent=msg;toastEl.className=`toast show ${kind||''}`;clearTimeout(toastT);toastT=setTimeout(()=>toastEl.className='toast',1600)}
function flash(d,kind){const c='flash-'+kind;d.el.classed(c,true);setTimeout(()=>d.el.classed(c,false),900)}
function clearMarks(){mk.classed('done reveal target hot sel flash-ok flash-bad',false);ITEMS.forEach(d=>d.isle&&d.isle.classed('show',false))}
function setPool(){
  const ids=new Set(pool().map(d=>d.id));
  ITEMS.forEach(d=>{const off=!ids.has(d.id);d.el.classed('off',off);d.range&&d.range.classed('off',off);d.isle&&d.isle.classed('off',off)});
}
let poolSec='all';
const pool=()=>ITEMS.filter(d=>poolSec==='all'||d.s===poolSec);
function poolSelect(){
  return `<div class="field"><label for="pool">Què vols practicar?</label><select id="pool">
    <option value="all"${poolSec==='all'?' selected':''}>Tot (39 noms)</option>
    ${SECS.map(s=>`<option value="${s.k}"${poolSec===s.k?' selected':''}>${s.name} (${ITEMS.filter(d=>d.s===s.k).length})</option>`).join('')}
  </select></div>`;
}
function bindPool(){const el=$('#pool');if(el)el.onchange=()=>{poolSec=el.value;start(mode)}}
const swatch=k=>`<span class="sw" style="color:${col(k)}"></span>`;

/* ---------- modes ---------- */
let mode='estudia';
let onMarker=()=>{};
mk.on('click',(e,d)=>{e.stopPropagation();onMarker(d)});
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>start(b.dataset.mode));

function start(m){
  mode=m;
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===m));
  svg.classed('study labels hidden-labels',false);
  clearMarks();setPool();scoreEl.innerHTML='';onMarker=()=>{};
  ({estudia:study,colloca:placeGame,troba:findGame,endevina:guessGame})[m]();
}

/* Estudia */
let hideLabels=false;
function study(){
  svg.classed('study',true).classed('labels',!hideLabels).classed('hidden-labels',hideLabels);
  const secs=SECS.filter(s=>poolSec==='all'||s.k===poolSec);
  panel.innerHTML=`<div class="ph"><h2>Estudia el mapa</h2>
    <p>Toca un nom per anar-hi. Amaga els noms per comprovar si te'ls saps: en passar per sobre d'un punt el veuràs.</p>
    <div class="row">${poolSelect()}</div>
    <label class="toggle"><input type="checkbox" id="hide"${hideLabels?' checked':''}> Amaga els noms del mapa</label></div>
    <div class="pb">${secs.map(s=>{const its=ITEMS.filter(d=>d.s===s.k);return `<section class="sec">
      <h3 style="color:${col(s.k)}">${swatch(s.k)}<span>${s.name}</span><span class="n">${its.length} noms</span></h3>
      <ul class="items">${its.map(d=>`<li><button class="item" data-id="${d.id}">
        <span class="nm">${esc(d.n)}${d.note?`<span class="note">${esc(d.note)}</span>`:''}</span>
        <span class="pips" title="Encerts a les proves">${[0,1,2].map(i=>`<i class="${i<level(d.id)?'on':''}"></i>`).join('')}</span>
      </button></li>`).join('')}</ul></section>`}).join('')}
      <div class="row"><button class="btn" id="reset-stats">Esborra el progrés</button><span class="muted">Els punts verds són els encerts a les proves.</span></div>
    </div>`;
  bindPool();
  $('#hide').onchange=e=>{hideLabels=e.target.checked;svg.classed('labels',!hideLabels).classed('hidden-labels',hideLabels)};
  const focus=d=>{
    mk.classed('target reveal',false);d.el.classed('target reveal',true);d.el.raise();flyTo(d);
    panel.querySelectorAll('.item').forEach(b=>b.classList.toggle('active',b.dataset.id===d.id));
  };
  panel.querySelectorAll('.item').forEach(b=>b.onclick=()=>focus(BY[b.dataset.id]));
  onMarker=d=>{focus(d);const b=panel.querySelector(`.item[data-id="${d.id}"]`);b&&b.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'})};
  let armed=false;
  $('#reset-stats').onclick=e=>{
    if(!armed){armed=true;e.target.textContent='Segur? Torna a tocar';return}
    stats={};try{localStorage.removeItem(KEY)}catch(_){ }study();
  };
}

/* Col·loca (arrossega noms al mapa) */
function placeGame(){
  const items=pool();let placed=new Set(),errors=0,selected=null;
  const render=()=>{
    const left=shuffle(items.filter(d=>!placed.has(d.id)));
    scoreEl.innerHTML=`<span class="ok">✓ ${placed.size}/${items.length}</span><span class="bad">✗ ${errors}</span>`;
    panel.innerHTML=`<div class="ph"><h2>Col·loca els noms</h2>
      <p>Arrossega cada nom fins al seu punt del mapa. També pots tocar un nom i després tocar el punt.</p>
      <div class="row">${poolSelect()}</div>
      <div class="progress" aria-hidden="true"><span style="width:${placed.size/items.length*100}%"></span></div></div>
      <div class="pb">${left.length?`<div class="chips">${left.map(d=>`<span class="chip" data-id="${d.id}" role="button" tabindex="0">${swatch(d.s)}${esc(d.n)}</span>`).join('')}</div>`
        :`<div class="summary"><span class="k eyebrow">Mapa complet</span><div class="big">${items.length}/${items.length}</div>
          <p>${errors===0?'Cap error. Perfecte!':`Ho has aconseguit amb ${errors} ${errors===1?'error':'errors'}.`}</p>
          <div class="row"><button class="btn primary" id="again">Torna-hi</button></div></div>`}
        <p class="muted">Consell: fes zoom per separar els punts que estan molt junts, com Vosges i Selva Negra.</p></div>`;
    bindPool();
    const again=$('#again');if(again)again.onclick=()=>start('colloca');
    panel.querySelectorAll('.chip').forEach(bindChip);
  };
  const tryPlace=(d,target,chipEl)=>{
    if(!target)return;
    if(target.id===d.id){
      placed.add(d.id);record(d.id,true);d.el.classed('done',true);d.isle&&d.isle.classed('show',true);flash(d,'ok');
      toast(`Correcte: ${d.n}`,'ok');selected=null;render();
    }else if(placed.has(target.id)){toast('Aquest punt ja està col·locat');}
    else{errors++;record(d.id,false);flash(target,'bad');toast(`Aquí no hi va ${d.n}`,'bad');
      if(chipEl){chipEl.classList.remove('shake');void chipEl.offsetWidth;chipEl.classList.add('shake')}
      scoreEl.innerHTML=`<span class="ok">✓ ${placed.size}/${items.length}</span><span class="bad">✗ ${errors}</span>`;}
  };
  const nearest=(x,y)=>{
    let best=null,bd=28;
    items.forEach(d=>{const r=d.el.select('.dot').node().getBoundingClientRect();const dx=r.x+r.width/2-x,dy=r.y+r.height/2-y,dist=Math.hypot(dx,dy);if(dist<bd){bd=dist;best=d}});
    return best;
  };
  const ghost=$('#ghost');
  function bindChip(el){
    const d=BY[el.dataset.id];let sx,sy,drag=false,hot=null;
    el.onpointerdown=e=>{e.preventDefault();sx=e.clientX;sy=e.clientY;drag=false;el.setPointerCapture(e.pointerId)};
    el.onpointermove=e=>{
      if(sx==null)return;
      if(!drag&&Math.hypot(e.clientX-sx,e.clientY-sy)>6){drag=true;ghost.innerHTML=el.innerHTML;ghost.hidden=false;el.style.opacity=.35}
      if(drag){
        ghost.style.transform=`translate(${e.clientX-ghost.offsetWidth/2}px,${e.clientY-ghost.offsetHeight-14}px)`;
        const n=nearest(e.clientX,e.clientY);if(n!==hot){hot&&hot.el.classed('hot',false);hot=n;hot&&hot.el.classed('hot',true)}
      }
    };
    el.onpointerup=e=>{
      if(sx==null)return;sx=null;
      if(drag){ghost.hidden=true;el.style.opacity='';hot&&hot.el.classed('hot',false);tryPlace(d,nearest(e.clientX,e.clientY),el);hot=null}
      else{selected=selected===d?null:d;panel.querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel',selected&&c.dataset.id===selected.id))}
    };
    el.onpointercancel=()=>{sx=null;ghost.hidden=true;el.style.opacity='';hot&&hot.el.classed('hot',false)};
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=d;panel.querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel',c===el))}};
  }
  onMarker=t=>{if(selected)tryPlace(selected,t,panel.querySelector(`.chip[data-id="${selected.id}"]`));else if(!placed.has(t.id))toast('Primer tria un nom de la llista')};
  render();
}

/* Motor comú per a Troba-ho i Quin és? */
function quiz({title,intro,askFor,setup,answer,replay}){
  let queue=shuffle(replay||pool()),i=0,ok=0,ko=0,missed=[],locked=false;
  const showScore=()=>scoreEl.innerHTML=`<span class="ok">✓ ${ok}</span><span class="bad">✗ ${ko}</span>`;
  const next=()=>{
    clearMarks();locked=false;
    if(i>=queue.length)return finish();
    const d=queue[i];showScore();
    panel.innerHTML=`<div class="ph"><h2>${title}</h2><p>${intro}</p><div class="row">${poolSelect()}</div>
      <div class="progress" aria-hidden="true"><span style="width:${i/queue.length*100}%"></span></div></div>
      <div class="pb"><div class="ask"><span class="k">Pregunta ${i+1} de ${queue.length}</span>${askFor(d)}</div>
      <div id="qbody"></div><div class="fb" id="fb" aria-live="polite"></div>
      <div class="row"><button class="btn" id="skip">Salta</button><button class="btn primary" id="nextb" hidden>Següent</button></div></div>`;
    bindPool();
    $('#skip').onclick=()=>resolve(d,false,true);
    $('#nextb').onclick=()=>{i++;next()};
    setup(d,(good)=>resolve(d,good));
  };
  const resolve=(d,good,skipped)=>{
    if(locked)return;locked=true;
    record(d.id,good);good?ok++:ko++;if(!good)missed.push(d);showScore();
    d.el.classed('reveal',true).classed('target',!good).raise();d.isle&&d.isle.classed('show',true);
    const fb=$('#fb');fb.className='fb '+(good?'ok':'bad');
    fb.textContent=good?`Molt bé! És ${d.n}.`:`${skipped?'Era':'No. Era'} ${d.n}. Mira'l al mapa.`;
    answer&&answer(d,good);
    $('#skip').hidden=true;
    if(good)setTimeout(()=>{if(queue[i]===d){i++;next()}},reduce?600:1000);
    else $('#nextb').hidden=false;
  };
  const finish=()=>{
    const pct=Math.round(ok/queue.length*100);
    panel.innerHTML=`<div class="ph"><h2>${title}</h2><div class="row">${poolSelect()}</div></div>
      <div class="pb"><div class="summary"><span class="eyebrow">Resultat</span><div class="big">${ok}/${queue.length}</div>
      <p>${pct===100?'Totes bé. Ja te les saps!':pct>=70?'Molt bé, ja quasi ho tens.':'Repassa les que has fallat i torna-hi.'}</p>
      ${missed.length?`<div><p class="muted">Has fallat:</p><div class="missed">${missed.map(d=>`<span>${esc(d.n)}</span>`).join('')}</div></div>`:''}
      <div class="row">${missed.length?'<button class="btn primary" id="retry">Repeteix les fallades</button>':''}<button class="btn" id="again">Torna a començar</button></div></div></div>`;
    bindPool();
    $('#again').onclick=()=>start(mode);
    const r=$('#retry');if(r)r.onclick=()=>{const m=missed.slice();clearMarks();quiz({title,intro,askFor,setup,answer,replay:m})};
  };
  next();
  return {get current(){return queue[i]},get locked(){return locked}};
}

/* Troba-ho: et dic el nom, tu toques el punt */
function findGame(){
  let q;
  q=quiz({title:'Troba-ho al mapa',intro:'Toca el punt del mapa on és aquest lloc.',
    askFor:d=>`<div class="q">${esc(d.n)}</div><div class="cat" style="color:${col(d.s)}">${swatch(d.s)}${secName(d.s)}</div>`,
    setup:(d,done)=>{onMarker=t=>{if(q.locked)return;if(t.id===d.id){flash(t,'ok');done(true)}else{flash(t,'bad');t.el.classed('reveal',true);setTimeout(()=>t.el.classed('reveal',false),1200);done(false)}}}});
}

/* Quin és?: el mapa marca un punt, tu tries el nom */
function guessGame(){
  quiz({title:'Quin és aquest lloc?',intro:'Mira el punt que parpelleja al mapa i tria el seu nom.',
    askFor:d=>`<div class="q">Quin nom té el punt marcat?</div><div class="cat" style="color:${col(d.s)}">${swatch(d.s)}${secName(d.s)}</div>`,
    setup:(d,done)=>{
      d.el.classed('target',true).raise();
      const same=shuffle(ITEMS.filter(x=>x.s===d.s&&x.id!==d.id)),rest=shuffle(ITEMS.filter(x=>x.s!==d.s));
      const opts=shuffle([d,...same.concat(rest).slice(0,3)]);
      $('#qbody').innerHTML=`<div class="opts">${opts.map((o,j)=>`<button class="opt" data-id="${o.id}"><kbd>${j+1}</kbd>${esc(o.n)}</button>`).join('')}</div>`;
      const btns=[...panel.querySelectorAll('.opt')];
      const pick=b=>{if(b.disabled)return;btns.forEach(x=>{x.disabled=true;if(x.dataset.id===d.id)x.classList.add('right')});if(b.dataset.id!==d.id)b.classList.add('wrong');d.el.classed('target',false);done(b.dataset.id===d.id)};
      btns.forEach(b=>b.onclick=()=>pick(b));
      document.onkeydown=e=>{if(mode!=='endevina')return;const n=+e.key;if(n>=1&&n<=btns.length)pick(btns[n-1]);else if(e.key==='Enter'){const nb=$('#nextb');nb&&!nb.hidden&&nb.click()}};
    }});
}

start('estudia');
</script>
